<meta charset="utf-8">

<title>My classwork · Math Island</title>
<style>body{margin:0}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered column on a dotted sky ground. Home lists two sections of five game rows; each game opens a ten-level grid. */
:root{
  --bg:#E4F5FF; --dot:rgba(18,48,63,.07);
  --surface:#FFFFFF; --ink:#12303F; --muted:#4F6B79; --edge:#C7E1EE; --line:#12303F;
  --coral:#E5432D; --coral-deep:#A92B19; --on-coral:#FFFFFF; --c1:#B3281A;
  --blue:#2F6FED; --c2:#1E4FB8;
  --teal:#0E9AA7; --teal-deep:#086872;
  --sun:#FFC83D; --empty:#FFF2C2;
  --good:#16A05F; --good-ink:#0C6A40; --good-bg:#DDF6E8;
  --bad:#D6362B; --hint-bg:#ECE8FF; --grape:#7A4DD8;
  --b0:#FFD9D2; --b1:#CFE0FF; --b2:#FFEFA8; --b3:#C5F0EE;
  --f-display:'Lilita One','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2230; --dot:rgba(234,246,252,.07);
    --surface:#17364A; --ink:#EAF6FC; --muted:#A9C4D2; --edge:#2C5670; --line:#EAF6FC;
    --coral:#FF7B66; --coral-deep:#C4452F; --on-coral:#2B0C07; --c1:#FF9A88;
    --blue:#7FA8FF; --c2:#A9C2FF;
    --teal:#43D0DC; --teal-deep:#6FE0EA;
    --sun:#FFD25A; --empty:#2A5068;
    --good:#3DD68C; --good-ink:#6EE6AA; --good-bg:#12402D;
    --bad:#FF8478; --hint-bg:#2B2A55; --grape:#A98BFF;
    --b0:#5A2E2A; --b1:#2A3F73; --b2:#5B4B1A; --b3:#1B5558;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2230; --dot:rgba(234,246,252,.07);
  --surface:#17364A; --ink:#EAF6FC; --muted:#A9C4D2; --edge:#2C5670; --line:#EAF6FC;
  --coral:#FF7B66; --coral-deep:#C4452F; --on-coral:#2B0C07; --c1:#FF9A88;
  --blue:#7FA8FF; --c2:#A9C2FF;
  --teal:#43D0DC; --teal-deep:#6FE0EA;
  --sun:#FFD25A; --empty:#2A5068;
  --good:#3DD68C; --good-ink:#6EE6AA; --good-bg:#12402D;
  --bad:#FF8478; --hint-bg:#2B2A55; --grape:#A98BFF;
  --b0:#5A2E2A; --b1:#2A3F73; --b2:#5B4B1A; --b3:#1B5558;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.2px,transparent 2.6px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:18px;
  line-height:1.35;
  padding-block:12px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;text-wrap:balance}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:46px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:24px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--edge);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.icon-btn[hidden]{display:none}
.icon-btn .off{display:none}
.icon-btn[aria-pressed="false"] .on{display:none}
.icon-btn[aria-pressed="false"] .off{display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--coral);color:var(--on-coral);font-family:var(--f-display);font-size:25px;padding:11px 30px;cursor:pointer;box-shadow:0 6px 0 var(--coral-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-deep)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.alt{background:var(--surface);color:var(--ink);border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);padding:8px 24px;font-size:21px}
.btn.alt:active{box-shadow:0 2px 0 var(--edge)}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;border:3px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px 5px 10px;font-weight:800;font-size:16px;cursor:pointer}
.chip svg{width:20px;height:20px}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;min-height:64px}

/* home */
.eyebrow{margin:6px 0 0;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-deep)}
.eyebrow.add{color:var(--c1)}
h1{font-size:clamp(36px,10vw,56px);line-height:1.02;margin:2px 0 8px}
.lead{margin:0 0 18px;color:var(--muted);font-weight:700;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 10px;padding-bottom:8px;border-bottom:4px solid var(--teal)}
.sechead.add{border-bottom-color:var(--coral)}
.sechead h2{font-size:clamp(26px,7vw,34px)}
.sechead p{margin:0;color:var(--muted);font-weight:700;font-size:16px}
.glist{display:grid;gap:12px}
.gcard{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:10px 14px 10px 10px;cursor:pointer;min-width:0}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.gthumb{height:72px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;color:var(--ink)}
.gthumb .pic{width:60px;height:60px}
.gthumb .bar-svg{width:76px}
.gtext{min-width:0}
.gtext h3{font-size:24px;line-height:1.1}
.gtext p{margin:2px 0 4px;color:var(--muted);font-weight:700;font-size:15px;line-height:1.25}
.gsum{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;color:var(--muted)}
.gsum svg{width:16px;height:16px;fill:var(--sun);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.foot{margin:24px 0 0;text-align:center;color:var(--muted);font-weight:700;font-size:16px;text-wrap:balance}

/* level select */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lvbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;background:var(--surface);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;min-width:0}
.lvbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lvbtn b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.lvbtn .ms{display:flex;gap:1px}
.lvbtn .ms svg{width:14px;height:14px;fill:var(--edge);stroke:none}
.lvbtn .ms .on svg{fill:var(--sun);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.lvbtn.hard{background:var(--b2)}

/* stars */
.stars{display:inline-flex;gap:4px}
.stars span{display:block;line-height:0}
.stars svg{width:30px;height:30px;fill:var(--edge)}
.stars .on svg{fill:var(--sun);stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}

/* game frame */
.game{user-select:none;-webkit-user-select:none}
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:26px}
.lvl{font-family:var(--f-display);font-size:22px;color:var(--teal-deep)}
.add-game .lvl{color:var(--c1)}
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--edge)}
.dot.done{background:var(--good)}
.dot.now{background:var(--coral);transform:scale(1.3)}
.promptrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 14px}
.prompt{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.18;text-wrap:balance}
.prompt .fr{font-size:1.15em;vertical-align:middle;margin:0 .1em}
.board{background:var(--surface);border:3px solid var(--edge);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.msg{min-height:3.4em;margin:14px 0 0;padding:10px 14px;border-radius:18px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.msg.good{background:var(--good-bg)}
.msg.hint{background:var(--hint-bg)}

/* pictures */
.figbox{width:min(58vw,240px);aspect-ratio:1;max-width:100%}
.pic{width:100%;height:100%;display:block;overflow:visible}
.part{fill:var(--empty);stroke:var(--surface);stroke-width:3;stroke-linejoin:round;transition:fill .12s}
.part.on{fill:var(--coral)}
.part.on2{fill:var(--blue)}
.outline{fill:none;stroke:var(--line);stroke-width:4;stroke-linejoin:round;pointer-events:none}
.tappable .part{cursor:pointer}
.tappable .part:focus-visible{outline:none;stroke:var(--grape);stroke-width:6}
.locked .part{pointer-events:none}
.counter{margin:0;font-family:var(--f-display);font-size:22px}
.counter b{color:var(--c1);font-weight:400}
.bar-svg{width:100%;max-width:340px;height:auto;display:block;overflow:visible}
.seg{fill:var(--empty);stroke:var(--surface);stroke-width:3}
.seg.on{fill:var(--coral)}
.seg.on2{fill:var(--blue)}
.seg.fill{animation:fillin .4s both}
@keyframes fillin{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.seg{transform-box:fill-box;transform-origin:50% 100%}

/* written fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-display);line-height:1;font-size:36px}
.fr .b{display:block;width:100%;min-width:30px;height:4px;border-radius:2px;background:currentColor;margin:4px 0}
.fr.c1{color:var(--c1)}
.fr.c2{color:var(--c2)}
.eqrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:36px}
.eqrow .op{color:var(--muted)}
.qm{display:inline-grid;place-items:center;min-width:56px;height:68px;border:4px dashed var(--muted);border-radius:16px;color:var(--muted)}

/* shared card buttons */
.ans{min-width:62px;padding:10px 6px;border:3px solid var(--ink);border-radius:20px;background:var(--surface);box-shadow:0 6px 0 var(--ink);cursor:pointer;display:grid;place-items:center}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ans.wrong{opacity:.4;pointer-events:none}
.ans.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 6px 0 var(--good)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* balloon pop */
.sky{display:flex;justify-content:center;flex-wrap:wrap;gap:14px 12px;width:100%;padding-top:6px}
.balloon{position:relative;width:96px;height:132px;border:0;background:none;padding:0;cursor:pointer;animation:bob 3s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{transform:translateY(-10px)}}
.bal-body{position:absolute;inset:0 0 28px 0;display:grid;place-items:center;border:4px solid var(--ink);border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:var(--b0);color:var(--ink)}
.balloon:nth-child(4n+2) .bal-body{background:var(--b1)}
.balloon:nth-child(4n+3) .bal-body{background:var(--b2)}
.balloon:nth-child(4n+4) .bal-body{background:var(--b3)}
.bal-body .fr{font-size:34px}
.bal-string{position:absolute;left:50%;bottom:0;width:3px;height:30px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
.balloon.popped{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.balloon.away{animation:away .8s forwards}
@keyframes away{to{transform:translateY(-70px);opacity:0}}
.balloon.wrong{animation:shake .4s;opacity:.55;pointer-events:none}

/* memory */
.memgrid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:8px;width:100%;max-width:440px}
.mem{aspect-ratio:1;padding:0;border:0;background:none;perspective:600px;cursor:pointer;min-width:0}
.mem .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.mem.up .in,.mem.done .in{transform:rotateY(180deg)}
.mem .front,.mem .back{position:absolute;inset:0;display:grid;place-items:center;border:3px solid var(--ink);border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.mem .front{background:var(--teal);color:var(--surface);font-family:var(--f-display);font-size:32px;box-shadow:0 4px 0 var(--ink)}
.mem .back{background:var(--surface);transform:rotateY(180deg);padding:4px}
.mem.done .back{background:var(--good-bg);border-color:var(--good)}
.mem .back .pic{width:100%;height:100%}
.mem .back .fr{font-size:clamp(20px,6vw,30px)}
.mem .back .fr .b{min-width:20px;height:3px;margin:3px 0}

/* fraction maker */
.maker{display:flex;flex-direction:column;align-items:center;gap:6px}
.mrow{display:flex;align-items:center;gap:12px}
.stp{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--surface);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-size:32px;line-height:1;cursor:pointer;display:grid;place-items:center}
.stp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mnum{min-width:84px;height:68px;display:grid;place-items:center;border:4px solid var(--edge);border-radius:18px;font-family:var(--f-display);font-size:46px;background:var(--bg)}
.mbar{width:150px;height:6px;border-radius:3px;background:var(--ink)}

/* detective */
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:420px}
.pick{padding:10px;border:3px solid var(--ink);border-radius:22px;background:var(--surface);box-shadow:0 6px 0 var(--ink);cursor:pointer;aspect-ratio:1;display:grid;place-items:center;min-width:0}
.pick:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pick .pic{width:100%;height:100%}
.pick.wrong{opacity:.4;pointer-events:none}
.pick.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 6px 0 var(--good)}
.picks.three{grid-template-columns:repeat(3,1fr);max-width:480px}

/* number pad */
.afr{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.afr .b{display:block;width:100%;height:5px;border-radius:3px;background:var(--ink)}
.fld{min-width:72px;height:62px;padding:0 10px;border:4px solid var(--edge);border-radius:16px;background:var(--surface);font-family:var(--f-display);font-size:38px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.fld.active{border-color:var(--grape);box-shadow:0 0 0 4px var(--hint-bg)}
.fld.fixed{border-style:dashed;color:var(--muted);cursor:default}
.fld.ok{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:10px;justify-content:center;margin-top:4px}
.key{height:56px;border:3px solid var(--ink);border-radius:18px;background:var(--surface);box-shadow:0 5px 0 var(--ink);font-family:var(--f-display);font-size:28px;cursor:pointer;display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.key.go{background:var(--coral);color:var(--on-coral);box-shadow:0 5px 0 var(--coral-deep)}
.keypad:has(.key:disabled){opacity:.5}

/* join + frog + verdict + pairs */
.stack{display:grid;gap:6px;width:100%;max-width:340px;justify-items:center}
.stack .plus{font-family:var(--f-display);font-size:28px;color:var(--muted);line-height:1}
.joined{width:100%;max-width:340px;display:grid;justify-items:center;gap:2px;padding-top:10px;border-top:3px dashed var(--edge)}
.joined small{font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.nline{width:100%;max-width:420px;height:auto;display:block;overflow:visible}
.nline .ax{stroke:var(--line);stroke-width:4;stroke-linecap:round}
.nline .tick{stroke:var(--line);stroke-width:3}
.nline .tk{fill:transparent;cursor:pointer}
.nline .tk:hover,.nline .tk:focus-visible{fill:var(--hint-bg);outline:none}
.nline .tk.right{fill:var(--good);opacity:.6}
.nline .tk.wrong{fill:var(--bad);opacity:.35}
.nline text{fill:var(--ink);font-family:var(--f-display);font-size:17px;text-anchor:middle}
.counter .fr{font-size:28px;vertical-align:middle}
.nline .lb{stroke:var(--ink);stroke-width:1.6}
.nline .hop{fill:none;stroke:var(--grape);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#frog{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.verdict{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:999px;padding:10px 26px 10px 18px;font-family:var(--f-display);font-size:26px;background:var(--surface);box-shadow:0 6px 0 var(--ink);cursor:pointer}
.verdict svg{width:30px;height:30px}
.verdict.yes{background:var(--good-bg)}
.verdict.no{background:var(--b0)}
.verdict:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.verdict:disabled{opacity:.4;pointer-events:none}
.claim{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.pairs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;width:100%}
.tile{width:64px;min-height:92px;border:3px solid var(--ink);border-radius:18px;background:var(--surface);box-shadow:0 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center;padding:8px 2px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.tile.sel{background:var(--hint-bg);border-color:var(--grape);box-shadow:0 5px 0 var(--grape)}
.tile.good{background:var(--good-bg);border-color:var(--good);box-shadow:0 5px 0 var(--good);pointer-events:none}
.target{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px;color:var(--muted)}

/* results */
.result{display:grid;justify-items:center;gap:14px;text-align:center;padding:26px 0 8px}
.result .stars svg{width:68px;height:68px}
.result .stars span{animation:starin .5s cubic-bezier(.3,1.6,.5,1) both}
.result .stars span:nth-child(2){animation-delay:.18s}
.result .stars span:nth-child(3){animation-delay:.36s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result p{margin:0;font-weight:700;color:var(--muted);text-wrap:balance}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{translate:0 115vh;rotate:540deg}}

/* mini thumbs */
.mini-balloon{display:grid;place-items:center;width:46px;height:56px;border:3px solid var(--ink);border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:var(--b0)}
.mini-balloon .fr{font-size:18px}.mini-balloon .fr .b{height:2px;margin:2px 0;min-width:14px}
.mini-card{display:grid;place-items:center;width:34px;height:44px;border:3px solid var(--ink);border-radius:9px;background:var(--teal);color:var(--surface);font-family:var(--f-display);font-size:20px}
.mini-card.up{background:var(--surface);color:var(--ink)}
.mini-card .pic{width:26px;height:26px}
.mini-card .fr{font-size:15px}.mini-card .fr .b{height:2px;margin:1px 0;min-width:10px}

/* Lesson 2: making 10 and column addition */
.sdate{flex-basis:100%;margin:0 0 -4px;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

.framebox{display:flex;justify-content:center;padding:8px 0 2px}

function mergePlays(list) { let n = 0; list.forEach(p => { if (p && p.i && !plays[p.i]) { plays[p.i] = { i: p.i, s: p.s, g: p.g, l: p.l, r: +p.r || 0, w: +p.w || 0, t: +p.t || 0, u: +p.u || 0, y: p.y || 0, m: p.m || [] }; n++; } else if (p && p.i && plays[p.i] && (+p.r + +p.w) > (plays[p.i].r + plays[p.i].w)) { Object.assign(plays[p.i], { r: +p.r, w: +p.w, u: +p.u, m: p.m || plays[p.i].m || [] }); n++; } }); if (n) savePlays(); return n; }

function statsFor(sid) {

const pct = (r, w) => (r + w) ? Math.round(100 * r / (r + w)) : null;

const secCls = (g) => { const S = SECTIONS.find(x => x.id === g.sec); return S && S.cls ? S.cls + '-game' : ''; };
function playRounds(g, level) {
  const total = g.rounds || 4, rounds = [], seen = new Set();
  for (let i = 0; i < total; i++) {
    let R, tries = 0;
    do { R = g.make(level); tries++; } while (seen.has(g.key(R)) && tries < 30);
    seen.add(g.key(R)); rounds.push(R);
  }
  let r = 0, mistakes = 0;
  function show() {
    const R = rounds[r], [ph, say] = g.prompt(R, level);
    const sec = html(`<section class="game ${secCls(g)}">${head(level, r, total)}${promptRow(ph, say)}<div class="board"></div><p class="msg" role="status" aria-live="polite"></p><div class="actions"></div></section>`);
    mount(sec);
    const actions = $('.actions', sec), msg = $('.msg', sec);
    const nextBtn = html(`<button class="btn" type="button" hidden>${r === total - 1 ? 'See my stars' : 'Next'}</button>`);
    actions.appendChild(nextBtn);
    let done = false;
    const c = {
      R, level, sec, board: $('.board', sec), msg, actions,
      addBtn(label, fn, cls = '') { const b = html(`<button class="btn ${cls}" type="button">${label}</button>`); b.addEventListener('click', fn); actions.insertBefore(b, nextBtn); return b; },
      good(t) { if (done) return; done = true; track(true); setMsg(msg, t, 'good'); sfx.ok(); nextBtn.hidden = false; },
      bad(t) { if (done) return; mistakes++; track(false, { q: plain(say), a: plain(t) }); setMsg(msg, t, 'hint'); sfx.no(); },
      info(t) { setMsg(msg, t, 'hint'); },
      get done() { return done; }
    };
    /*T1*/
    g.view(c);
    nextBtn.addEventListener('click', () => { r++; if (r >= total) finish(g, level, starsFor(mistakes)); else show(); });
  }
  show();
}

/* =====================  9S COUNTING  ===================== */
const numWords = (n) => {
  const ones = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  if (n < 20) return ones[n];
  if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : '');
  if (n === 100) return 'one hundred';

/* ---- Lesson: adding a one-digit number to a two-digit number, column method (Saud) ---- */
/* a is two-digit, b is one-digit. Levels 1-3 no carry, 4-6 carry, 7 mixed, 8 ones add to 9 or 10, 9 crosses 100, 10 everything.
   mix = true gives about half carry and half no-carry at every level (for yes/no and spot-the-mistake games). */
function addGen(level, mix) {
  const maxA = [40, 70, 99, 50, 70, 99, 99, 99, 99, 99][level - 1];
  const want = mix ? Math.random() < 0.5 : level <= 3 ? false : level <= 6 ? true : undefined;
  const wantCross = Math.random() < 0.4;
  for (let t = 0; t < 2000; t++) {
    const hiA = (level === 9 && (!mix || want)) || (level === 10 && wantCross && want !== false);
    const a = hiA ? 90 + rand(10) : 10 + rand(maxA - 9), b = 1 + rand(9), o = a % 10, os = o + b, carry = os >= 10, cross = a + b >= 100;
    if (want !== undefined && carry !== want) continue;
    if (level === 1 && b > 5) continue;
    if (level <= 8 && cross) continue;
    if (level === 8 && !(os === 9 || os === 10)) continue;
    if (level === 9 && !mix && !cross) continue;
    if (level === 9 && mix && carry && !cross) continue;
    if (level === 10 && carry && cross !== wantCross) continue;
    return { a, b, o, os, carry, cross, sum: a + b };
  }
  return { a: 38, b: 5, o: 8, os: 13, carry: true, cross: false, sum: 43, fb: true };

  if (s.carryRow !== false) out += row({ [T]: s.c1 || '', ...(s.co ? { [O]: s.co } : {}), ...(H > 0 ? { [H]: s.c2 || '' } : {}) }, 'cr');

/* ---- Lesson: adding up to 20 (Ali and Abood) ---- */
/* levels: 1 ten + ones | 2-3 teen + ones (no bridging) | 4-5 single + single over 10 | 6 doubles and near doubles | 7 teen + ones up to 20
           8 mix of 4-7 | 9 any two numbers (one may be a teen) | 10 mostly 9 with doubles and teens */
function pair20(level) {
  for (let t = 0; t < 3000; t++) {
    const k = level === 8 ? pick([4, 5, 6, 7]) : level === 10 ? pick([9, 9, 7, 6]) : level;
    let a, b;
    if (k === 1) { a = 10; b = 1 + rand(9); }
    else if (k === 2) { a = 10 + rand(6); b = 1 + rand(9); if (a % 10 + b > 9) continue; }
    else if (k === 3) { a = 11 + rand(9); b = 1 + rand(9); if (a % 10 + b > 9) continue; }
    else if (k === 4) { a = 2 + rand(8); b = 2 + rand(8); if (a + b < 11 || a + b > 14) continue; }
    else if (k === 5) { a = 2 + rand(8); b = 2 + rand(8); if (a + b < 11) continue; }
    else if (k === 6) { a = 5 + rand(6); b = a + pick([0, 0, 1, -1]); if (b < 1 || b > 10) continue; }
    else if (k === 7) { a = 11 + rand(9); b = 1 + rand(9); if (a + b > 20) continue; }
    else { a = 1 + rand(19); b = 1 + rand(19); if (a + b < 11 || a + b > 20) continue; }
    if (k <= 3 && Math.random() < 0.4) [a, b] = [b, a];
    return { a, b, s: a + b };
  }
  return { a: 10, b: 5, s: 15, fb: true };
}

/* ---- Lesson: adding a one-digit number to a two-digit number, without carrying (Saud) ---- */
/* the ones always add to 9 or less. The tens digit never changes. */
function ncGen(level) {
  const maxA = [29, 49, 59, 69, 79, 89, 99, 99, 99, 99][level - 1], maxB = [4, 5, 6, 7, 8, 9, 9, 9, 9, 9][level - 1];
  for (let t = 0; t < 2000; t++) {
    const a = 10 + rand(maxA - 9), b = 1 + rand(maxB), o = a % 10;
    if (o + b > 9) continue;
    if (o === 0 && Math.random() < 0.8) continue;
    return { a, b, o, t: Math.floor(a / 10), so: o + b, sum: a + b };
  }
  return { a: 34, b: 5, o: 4, t: 3, so: 9, sum: 39, fb: true };
}

/* ---- Saud: Adding without carrying, set 2 (same lesson, five new games) ---- */
const wrongSum = (g) => {
  const kind = pick(['o1', 'o2', 't', 'o1', 'swap']);
  let v = g.sum;
  if (kind === 'o1') v = g.sum + pick([1, -1]);
  else if (kind === 'o2') v = g.sum + pick([2, -2, 3, -3]);
  else if (kind === 't') v = g.sum + pick([10, -10]);
  else { const s = +String(g.sum).split('').reverse().join(''); v = (s !== g.sum && s >= 10) ? s : g.sum + 1; }
  return { v: v === g.sum || v < 10 ? g.sum + 1 : v, kind };
};

/* ---- Lesson 4 (8 Nov 2026): subtraction. Ali and Abood: one digit minus one digit. Saud: two digit minus one digit, no borrowing ---- */
const MINUS = '\u2212';
/* Ali and Abood: a is 2 to 9, b is 1 to a */
function sub1Gen(level) {
  const maxA = [5, 6, 7, 8, 9, 9, 9, 9, 9, 9][level - 1], maxB = [2, 2, 3, 4, 4, 5, 6, 7, 8, 9][level - 1];
  for (let t = 0; t < 2000; t++) {
    const a = 2 + rand(maxA - 1), b = 1 + rand(Math.min(maxB, a));
    if (level >= 6 && b === a && Math.random() < 0.6) continue;
    if (level <= 4 && b === a) continue;
    if (level >= 7 && b < a - 4 && Math.random() < 0.6) continue;
    return { a, b, d: a - b };
  }
  return { a: 7, b: 3, d: 4, fb: true };
}
/* Saud: 2-digit a, one-digit b, the ones digit of a is at least b (no borrowing) */
function sub2Gen(level) {
  const maxA = [29, 39, 49, 59, 69, 79, 89, 99, 99, 99][level - 1], maxB = [3, 4, 5, 6, 7, 8, 9, 9, 9, 9][level - 1];
  for (let t = 0; t < 3000; t++) {
    const a = 10 + rand(maxA - 9), o = a % 10;
    if (o < 1) continue;
    const b = 1 + rand(Math.min(maxB, o)), so = o - b;
    if (so === 0 && level < 6 && Math.random() < 0.8) continue;
    return { a, b, o, t: Math.floor(a / 10), so, d: a - b };
  }
  return { a: 37, b: 4, o: 7, t: 3, so: 3, d: 33, fb: true };
}

/* Ali and Abood. a 11..20, b 1..9. L1-3 never cross 10, L4-6 always cross 10, L7-10 mixed */
function teenGen(level) {
  const maxA = [14, 15, 16, 17, 18, 19, 20, 20, 20, 20][level - 1], bridge = level <= 3 ? false : level <= 6 ? true : Math.random() < 0.7;
  for (let t = 0; t < 2000; t++) {
    const a = 11 + rand(maxA - 10), b = 1 + rand(9), o = a - 10;
    if ((b > o) !== bridge) continue;
    return { a, b, o, d: a - b };
  }
  return { a: 15, b: 7, o: 5, d: 8, fb: true };
}
/* crossing 10 only, a 11..18: used by Via Ten. r = how many are left to take after reaching 10 */
function viaGen(level) {
  const maxA = [14, 15, 16, 17, 18, 18, 18, 18, 18, 18][level - 1], maxR = [2, 2, 3, 3, 4, 5, 6, 7, 8, 8][level - 1];
  for (let t = 0; t < 2000; t++) {
    const a = 11 + rand(maxA - 10), o = a - 10, b = o + 1 + rand(9 - o), r = b - o;
    if (r > maxR) continue;
    return { a, b, o, r, d: a - b };
  }
  return { a: 15, b: 7, o: 5, r: 2, d: 8, fb: true };
}
/* Saud. a 20..99, the ones digit is smaller than b (borrow). Easy levels keep a non-zero ones digit */
function borGen(level) {
  const maxA = [39, 49, 59, 69, 79, 89, 99, 99, 99, 99][level - 1];
  for (let t = 0; t < 3000; t++) {
    const a = 20 + rand(maxA - 19), o = a % 10;
    if (o > 8 || (o === 0 && level <= 4)) continue;
    const b = o + 1 + rand(9 - o);
    return { a, b, o, t: Math.floor(a / 10), o10: 10 + o, so: 10 + o - b, nt: Math.floor(a / 10) - 1, d: a - b };
  }
  return { a: 42, b: 7, o: 2, t: 4, o10: 12, so: 5, nt: 3, d: 35, fb: true };
}

/* ===== Saud: borrowing ===== */
/* 1. Break a Ten */
GAMES.push({
  id: 'nsrods', sec: 'sub4', title: 'Break a Ten', desc: 'Not enough ones? Tap a rod to break it into 10 cubes.',
  thumb: () => '<svg class="ico" viewBox="0 0 44 32" aria-hidden="true"><g stroke="var(--line)" stroke-width="2"><rect x="5" y="3" width="6" height="24" rx="1.5" fill="var(--b1)"/><rect x="14" y="3" width="6" height="24" rx="1.5" fill="var(--b1)" opacity=".4" stroke-dasharray="3 2"/><rect x="26" y="17" width="7" height="7" fill="var(--coral)"/><rect x="26" y="8" width="7" height="7" fill="var(--coral)"/><rect x="35" y="17" width="7" height="7" fill="var(--blue)"/></g></svg>',
  key: R => `${R.a}-${R.b}`,
  make(level) { const g = borGen(level); return { ...g, opts: numOptions(g.d, level <= 4 ? 3 : 4, [1, 2, 10, 5], 10, 99) }; },
  prompt: R => [`${R.a} minus ${R.b}. Break a ten if you need to. Then pick the answer.`, `${R.a} minus ${R.b}. There are not enough ones. Break a ten rod. Then take away ${R.b}.`],
  view(c) {
    const R = c.R; let broken = false, n = 0;
    c.board.innerHTML = eqHTML([R.a, MINUS, R.b, '=', '?']) + `<div class="blocks"><div class="bgrp"><div class="rods">${Array.from({ length: R.t }, () => '<button class="rod" type="button" aria-label="Ten. Tap to break it"></button>').join('')}</div><div class="cubes">${Array.from({ length: R.o }, () => '<button class="cube a" type="button" aria-label="One"></button>').join('')}</div></div></div><p class="counter">Taken away: <b>0</b> of ${R.b}</p>`;
    const cubes = $('.cubes', c.board), cnt = $('.counter b', c.board);
    c.board.addEventListener('click', (e) => {
      if (c.done) return;
      const rod = e.target.closest('.rod'), cube = e.target.closest('.cube');
      if (rod) {
        if (broken) { c.info('You only need to break one ten.'); sfx.no(); return; }
        broken = true; rod.remove(); sfx.pick();
        cubes.insertAdjacentHTML('beforeend', Array.from({ length: 10 }, () => '<button class="cube b" type="button" aria-label="One"></button>').join(''));
        c.info(`You broke a ten into 10 ones. Now you have ${R.o10} ones. Take away ${R.b}.`);
      } else if (cube && !cube.classList.contains('gone')) {
        if (n >= R.b) { c.info(`That is enough. You took away ${R.b}. Now count what is left.`); sfx.no(); return; }
        cube.classList.add('gone'); n++; cnt.textContent = n; speak(String(n)); sfx.pick();
        if (n === R.b) c.info(`You took away ${R.b}. Count the tens and the ones that are left.`);
      }
    });
    c.board.addEventListener('click', (e) => { if (!c.done && n < R.b && !broken && e.target.closest('.cube') && $$('.cube:not(.gone)', c.board).length === 0) c.info('No more ones. Break a ten rod.'); });
    numAnswers(c, R.opts, R.d, `Yes! ${R.a} ${MINUS} ${R.b} = ${R.d}. Break a ten: ${R.o10} ones ${MINUS} ${R.b} = ${R.so}. ${R.nt} tens are left.`, () => `${R.o} ones is not enough to take away ${R.b}. Break a ten into 10 ones. Then ${R.o10} ${MINUS} ${R.b}.`);
  }
});
/* 2. Column Steps */
GAMES.push({
  id: 'nscolsteps', sec: 'sub4', title: 'Column Steps', desc: 'Borrow in the column. One step at a time.',
  thumb: () => '<span class="mini-col"><b>4 2</b><b>&minus; 7</b><b class="q">35</b></span>',
  key: R => `${R.a}-${R.b}`,
  make(level) { return borGen(level); },
  prompt: R => [`${R.a} minus ${R.b}. Use the column method.`, `${R.a} minus ${R.b}. Use the column method. Go one step at a time.`],
  view(c) {
    const R = c.R; let st = 0;
    const holder = html('<div></div>'); c.board.appendChild(holder);
    const col = () => {
      const bor = st >= 1;
      return `<div class="colwrap">${colHTML(R, { op: MINUS, labels: true, carryRow: true, c1: bor ? R.nt : '', top: [bor ? `<span class="strike">${R.t}</span>` : R.t, bor ? `<span class="b10">1</span>${R.o}` : R.o], ans: ['', st >= 3 ? R.nt : (st === 2 ? '<span class="qd">?</span>' : ''), st >= 2 ? R.so : (st === 1 ? '<span class="qd">?</span>' : '')] })}</div>`;
    };
    const run = () => {
      holder.innerHTML = col() + '<div id="stg"></div>'; const host = $('#stg', holder);
      if (st === 0) {
        const box = html(`<div><p class="stepq">Can you take ${R.b} from ${R.o}?</p><div class="tf"><button class="tfb yes" type="button" data-v="1"><b>&#10003;</b>Yes</button><button class="tfb no" type="button" data-v="0"><b>&#10007;</b>No</button></div></div>`);
        host.appendChild(box);
        $$('.tfb', box).forEach(b => b.addEventListener('click', () => {
          if (c.done) return;
          if (b.dataset.v === '0') { b.classList.add('right'); st = 1; c.info(`${R.o} is smaller than ${R.b}. Borrow a ten: ${R.t} becomes ${R.nt}, and ${R.o} becomes ${R.o10}.`); run(); }
          else { b.classList.add('wrong'); c.bad(`${R.o} is smaller than ${R.b}. You cannot take ${R.b} from ${R.o}. You must borrow.`); }
        }));
      } else if (st === 1) stepPick(c, host, `Ones: ${R.o10} ${MINUS} ${R.b} = ?`, R.so, numOptions(R.so, 4, [1, 2, 3], 0, 9), '', () => `Count back ${R.b} from ${R.o10}.`, () => { st = 2; c.info(`${R.o10} ${MINUS} ${R.b} = ${R.so}. Now the tens.`); run(); });
      else stepPick(c, host, `Tens: you borrowed one. ${R.t} becomes? Write the tens.`, R.nt, numOptions(R.nt, 3, [1, 2], 1, 9), '', () => `You borrowed 1 from ${R.t}. ${R.t} ${MINUS} 1 = ?`, () => { st = 3; holder.innerHTML = col(); c.good(`Yes! ${R.a} ${MINUS} ${R.b} = ${R.d}.`); speak(`${R.a} minus ${R.b} equals ${R.d}`); });
    };
    run();
  }
});

GAMES.push({
