*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 18px 36px;font:16px/1.5 Archivo,system-ui,sans-serif;color:var(--ink);background-color:var(--paper);

main{width:min(460px,100%);background:var(--card);border:3px solid var(--edge);border-radius:6px;box-shadow:10px 10px 0 var(--edge);overflow:hidden}
.plate{position:relative;padding:24px 24px 22px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;border-bottom:3px solid var(--edge);overflow:hidden}
.geo{position:absolute;right:8px;top:18px;width:74%;height:60%;pointer-events:none;color:var(--edge)}
.geo-svg{width:100%;height:100%;display:block;overflow:visible}
.geo .g-con{fill:none;stroke:currentColor;stroke-width:1.2;stroke-dasharray:3 6;opacity:.5}
.geo .g1{fill:var(--blue)}.geo .g2{fill:var(--red);mix-blend-mode:multiply}.geo .g3{fill:var(--yellow);stroke:var(--edge);stroke-width:3}
.geo .g4{fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:2400}
.geo .g5{fill:currentColor}.geo .g5 text{font-family:"Instrument Serif",serif;font-style:italic;font-size:30px}
@media (prefers-color-scheme:dark){.geo .g2{mix-blend-mode:screen}}
@media (prefers-reduced-motion:no-preference){
 .geo .g1,.geo .g2,.geo .g3{transform-box:fill-box;transform-origin:center;animation:geoIn .9s cubic-bezier(.2,1.4,.35,1) both}
 .geo .g2{animation-delay:.12s}.geo .g3{animation-delay:.24s}
 .geo .g4{animation:geoDraw 2.2s .35s cubic-bezier(.6,0,.2,1) both}.geo .g5{animation:geoFade .6s 1.2s both}
 @keyframes geoIn{from{transform:scale(0) rotate(-40deg)}}@keyframes geoDraw{from{stroke-dashoffset:2400}}@keyframes geoFade{from{opacity:0}}}
.mk{position:relative;z-index:1;width:56px;height:56px;border-radius:4px;display:grid;place-items:center;background:var(--yellow);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);transform:rotate(-6deg);
 font:italic 400 40px/1 "Instrument Serif",serif;color:#151412;position:absolute;left:24px;top:24px}
h1{position:relative;z-index:1;font-family:Archivo,"Arial Black",sans-serif;font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:clamp(48px,13vw,64px);line-height:.86;letter-spacing:-.035em;margin:0}
.sub{position:relative;z-index:1;font:italic 400 24px "Instrument Serif",serif;color:var(--red);margin:8px 0 0}
.body{padding:22px 24px 24px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border:2.5px solid var(--edge);border-radius:6px;margin-bottom:4px}
.seg button{border:2px solid transparent;border-radius:4px;padding:10px;font:800 15px Archivo,sans-serif;font-stretch:112%;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--yellow);color:#151412;border-color:var(--edge)}
label{display:block;font:italic 400 19px "Instrument Serif",serif;color:var(--muted);margin:14px 0 4px}
input{width:100%;font:inherit;font-size:17px;padding:12px 13px;border:2.5px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.go{width:100%;margin-top:20px;border:2.5px solid var(--edge);border-radius:6px;padding:14px;font:900 18px Archivo,sans-serif;font-stretch:118%;background:var(--blue);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--edge)}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.go:disabled{opacity:.55;cursor:wait}
.err{margin-top:14px;padding:10px 12px;border:2px solid var(--edge);border-radius:6px;background:var(--bad-soft);color:var(--red);font-size:14px;font-weight:600}
.link{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-top:14px;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
[hidden]{display:none!important}

    <h1>Mathkn</h1>
    <p class="sub">Earn XP. Level up.</p>
  </div>
  <div class="body">
  <div class="seg" role="tablist">
    <button type="button" id="tabS" aria-pressed="true">Student</button>
    <button type="button" id="tabT" aria-pressed="false">Teacher</button>
  </div>

  <form id="fS" autocomplete="on">
    <label for="sid">Your ID</label>
    <input id="sid" name="username" inputmode="text" autocapitalize="off" autocomplete="username" placeholder="for example 16-00014" required>
    <label for="pin">Your PIN</label>
    <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6 digits from your teacher" required>
    <button class="go" type="submit">Log in</button>
  </form>

  <form id="fT" hidden>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="email" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required minlength="6">
    <div id="inviteWrap" hidden>
      <label for="inv">Teacher invite code</label>
      <input id="inv" autocomplete="off">
    </div>
    <button class="go" type="submit" id="goT">Log in</button>
    <button class="link" type="button" id="toggleNew">I am new: create a teacher account</button>
  </form>

  <div class="err" id="err" role="alert" hidden></div>
  <div class="foot">Forgot your PIN? Ask your teacher.</div>
  </div>
</main>

<script type="module">
import { auth, fs, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, doc, setDoc, emailFor, profileOf, whenUser, friendlyError } from "./fb.js";
const $ = id => document.getElementById(id);
let creating = false;
const showErr = m => { $("err").textContent = m; $("err").hidden = !m; };
const tab = t => { $("fS").hidden = t !== "S"; $("fT").hidden = t !== "T"; $("tabS").setAttribute("aria-pressed", t === "S"); $("tabT").setAttribute("aria-pressed", t === "T"); showErr(""); };
$("tabS").onclick = () => tab("S"); $("tabT").onclick = () => tab("T");
$("toggleNew").onclick = () => {
  creating = !creating; $("inviteWrap").hidden = !creating; $("inv").required = creating;
  $("goT").textContent = creating ? "Create teacher account" : "Log in";
  $("toggleNew").textContent = creating ? "I already have an account: log in" : "I am new: create a teacher account";
  showErr("");
};
async function go(uid) {
  const p = await profileOf(uid);
  if (!p) { await signOut(auth); throw { code: "no-profile" }; }
  location.href = p.role === "teacher" ? "teacher.html" : "student.html";
}
$("fS").onsubmit = async e => {
  e.preventDefault(); showErr(""); const b = e.target.querySelector("button"); b.disabled = true;
  try { const c = await signInWithEmailAndPassword(auth, emailFor($("sid").value), $("pin").value.trim()); await go(c.user.uid); }
  catch (er) { showErr(er.code === "no-profile" ? "This login is not set up yet. Ask your teacher." : friendlyError(er)); b.disabled = false; }
};
$("fT").onsubmit = async e => {
  e.preventDefault(); showErr(""); const b = $("goT"); b.disabled = true;
  try {
    if (creating) {
      const c = await createUserWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value);
      await setDoc(doc(fs, "users", c.user.uid), { role: "teacher", code: $("inv").value.trim(), name: $("em").value.trim() });
      await go(c.user.uid);
    } else {
      const c = await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); await go(c.user.uid);
    }
  } catch (er) {
    if (creating && auth.currentUser) { try { await auth.currentUser.delete(); } catch {} }   // do not leave a half-made account
    showErr(er.code === "no-profile" ? "This account is not a teacher account." : friendlyError(er)); b.disabled = false;
  }
};
// Already signed in? Go straight to the right page.
whenUser().then(u => { if (u) go(u.uid).catch(() => {}); });
</script>
