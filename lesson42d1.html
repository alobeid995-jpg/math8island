<!-- ============ MIND MAP ============ -->
<div id="map" class="view on">
 <div id="canvas">
  <svg id="links" width="1600" height="800" viewBox="0 0 1600 800"></svg>
  <div class="node title" style="left:20px;top:205px;width:250px;height:390px;--d:.1s">
    <div class="chip">UNIT 4 · EQUATIONS AND INEQUALITIES</div>
    <h1>Solving Simultaneous Equations Graphically</h1>

<script>
(function(){

/* ================= MIND MAP ================= */

const NW=190, NH=175, COLX={A:330,B:565,C:800,D:1035}, ROWY={1:140,2:485};
const NODES = [];
[[1,"Draw straight-line graphs from tables of values.","Example 1 · Guided","y = x + 2 and y = 2x","Workbook Q3 a–c","Page 60","Draw both lines"],
 [2,"Use the intersection to solve simultaneous equations.","Example 2 · Manual","y = x + 1 and y = 3 − x","Read the graph, then check it","Is Leen right?","Workbook Q3 d, e and Q8"]].forEach(([n,obj,we,weS,pr,prS,ind])=>{

});

(function links(){

    else { const x1=A.x+A.w, y1=A.y+A.h/2, x2=B.x, y2=B.y+B.h/2, dx=(x2-x1)/2; d=`M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`; }

    L.appendChild(p);
    const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    p.style.transition=`stroke-dashoffset .7s ease-out ${(.3+i*.18).toFixed(2)}s`;

function confetti(x,y){

/* ================= STAGE ================= */
const COL = {1:"#2563eb",2:"#ea580c",3:"#15803d"};
const M = 44;
const EX = [
  { mode:"guided", name:"Worked Example 1", X1:6, Y1:10, U:48, xs:[0,2,4],
    l1:{t:"y = x + 2", m:1, c:2, chk:"4 = 2 + 2 ✓"}, l2:{t:"y = 2x", m:2, c:0, chk:"4 = 2 × 2 ✓"},
    alg:[["x + 2 = 2x","Make the y’s equal"],["2 = 2x − x","Move x across — its sign changes"],["2 = x","Simplify"],["x = 2, and y = 2 + 2 = 4","Same answer as the graph ✓"]] },
  { mode:"manual", name:"Worked Example 2", X1:5, Y1:6, U:64, xs:[0,1,2,3],
    l1:{t:"y = x + 1", m:1, c:1, chk:"2 = 1 + 1 ✓"}, l2:{t:"y = 3 − x", m:-1, c:3, chk:"2 = 3 − 1 ✓"},
    alg:[["x + 1 = 3 − x","Make the y’s equal"],["x + x = 3 − 1","Move −x and +1 across — signs change"],["2x = 2","Simplify"],["x = 1, and y = 1 + 1 = 2","Same answer as the graph ✓"]] }
];

let ex, st, manual, X1, Y1, U, W, H, cur = 0, timer = null, drag = null;
let gLines, gPts, gTop, gFx, gRuler;
const svg = $("g");
svg.style.touchAction = "none";
const sx = x => M + x*U, sy = y => M + (Y1-y)*U;
const yOf = (l,x) => l.m*x + l.c;
function el(n,a,p){ const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }

/* ---------- static graph ---------- */
function buildGraph(){
  W = 2*M + X1*U; H = 2*M + Y1*U;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.innerHTML = "";
  const defs = el("defs",{},svg), cp = el("clipPath",{id:"clipArea"},defs);
  el("rect",{x:sx(0),y:sy(Y1),width:X1*U,height:Y1*U},cp);
  const grid = el("g",{},svg);
  for(let i=0;i<=X1;i++) el("line",{x1:sx(i),y1:sy(0),x2:sx(i),y2:sy(Y1),stroke:i%5===0?"#c3cbd9":"#e2e7f0","stroke-width":i%5===0?1.2:1},grid);
  for(let j=0;j<=Y1;j++) el("line",{x1:sx(0),y1:sy(j),x2:sx(X1),y2:sy(j),stroke:j%5===0?"#c3cbd9":"#e2e7f0","stroke-width":j%5===0?1.2:1},grid);
  const ax = el("g",{stroke:"#111827","stroke-width":2},svg);
  el("line",{x1:sx(0)-8,y1:sy(0),x2:sx(X1)+12,y2:sy(0)},ax);
  el("line",{x1:sx(0),y1:sy(0)+8,x2:sx(0),y2:sy(Y1)-12},ax);
  el("polygon",{points:`${sx(X1)+17},${sy(0)} ${sx(X1)+7},${sy(0)-5} ${sx(X1)+7},${sy(0)+5}`,fill:"#111827"},svg);
  el("polygon",{points:`${sx(0)},${sy(Y1)-17} ${sx(0)-5},${sy(Y1)-7} ${sx(0)+5},${sy(Y1)-7}`,fill:"#111827"},svg);
  for(let i=1;i<=X1;i++) el("text",{x:sx(i),y:sy(0)+19,"text-anchor":"middle","font-size":14,fill:"#4b5563"},svg).textContent = i;
  for(let j=1;j<=Y1;j++) el("text",{x:sx(0)-9,y:sy(j)+5,"text-anchor":"end","font-size":14,fill:"#4b5563"},svg).textContent = j;
  el("text",{x:sx(0)-9,y:sy(0)+19,"text-anchor":"end","font-size":14,fill:"#4b5563"},svg).textContent = "0";
  el("text",{x:sx(X1)+10,y:sy(0)-12,"font-size":18,"font-weight":700,"font-style":"italic"},svg).textContent = "x";
  el("text",{x:sx(0)+12,y:sy(Y1)-8,"font-size":18,"font-weight":700,"font-style":"italic"},svg).textContent = "y";
  gLines = el("g",{"clip-path":"url(#clipArea)"},svg);
  gPts = el("g",{},svg);
  gTop = el("g",{"pointer-events":"none"},svg);
  gFx = el("g",{"pointer-events":"none"},svg);
  gRuler = el("g",{"pointer-events":"none"},svg);
}
function star(cx,cy,ro,ri){ let s=""; for(let i=0;i<10;i++){ const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/5; s+=(cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1)+" "; } return s.trim(); }

/* ---------- render from state ---------- */
function render(anim){
  anim = anim || {};
  const fresh = new Set((anim.pts||[]).map(o=>o.k+"_"+o.x));
  gLines.innerHTML = ""; gPts.innerHTML = ""; gTop.innerHTML = "";
  [1,2].forEach(k=>{
    if(!st.lineDone[k]) return;
    const l = ex["l"+k], A=-1, B=X1+1;
    const x1=sx(A), y1=sy(yOf(l,A)), x2=sx(B), y2=sy(yOf(l,B));
    const ln = el("line",{x1,y1,x2,y2,stroke:COL[k],"stroke-width":4,"stroke-linecap":"round"},gLines);
    if(anim.line === k){
      const len = Math.hypot(x2-x1,y2-y1);
      ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ ln.style.transition="stroke-dashoffset 1s ease-in-out"; ln.style.strokeDashoffset=0; }));
    }
  });
  [2,1].forEach(k=>{
    ex.xs.forEach(x=>{
      if(!st.plotted[k][x]) return;
      const y = st.vals[k][x], isNew = fresh.has(k+"_"+x);
      const g = el("g",{class:"pt"+(isNew?" new":""),"data-k":k,"data-x":x},gPts);
      const sh = el("g",{class:"shape"},g);
      if(k===1) el("circle",{cx:sx(x),cy:sy(y),r:9,fill:COL[1],stroke:"#fff","stroke-width":2},sh);
      else el("rect",{x:sx(x)-8,y:sy(y)-8,width:16,height:16,fill:COL[2],stroke:"#fff","stroke-width":2},sh);
      const lab = "("+N(x)+", "+N(y)+")", lw = lab.length*8;
      const flip = sx(x)+12+lw > W-2;
      const t = el("text",{x:flip?sx(x)-12:sx(x)+12,y:sy(y)+(k===1?-12:23),"text-anchor":flip?"end":"start","font-size":14,"font-weight":800,fill:COL[k],"paint-order":"stroke",stroke:"#fff","stroke-width":3.5},g);
      t.textContent = lab;
      if(isNew) el("circle",{cx:sx(x),cy:sy(y),r:14,fill:"none",stroke:COL[k],"stroke-width":3,class:"ripple"},gTop);
    });
  });
  if(st.inter) drawSolution();
  syncTables();
}

function drawSolution(){
  const X=st.sol.x, Y=st.sol.y, gx=sx(X), gy=sy(Y);
  const gd = el("g",{class:"fadein"},gTop);
  el("line",{x1:gx,y1:gy,x2:gx,y2:sy(0),stroke:COL[3],"stroke-width":2.5,"stroke-dasharray":"6 5"},gd);
  el("line",{x1:gx,y1:gy,x2:sx(0),y2:gy,stroke:COL[3],"stroke-width":2.5,"stroke-dasharray":"6 5"},gd);
  el("rect",{x:gx-14,y:sy(0)+4,width:28,height:20,rx:5,fill:"#dcfce7"},gd);
  el("text",{x:gx,y:sy(0)+19,"text-anchor":"middle","font-size":15,"font-weight":800,fill:"#14532d"},gd).textContent = N(X);
  el("rect",{x:sx(0)-36,y:gy-11,width:28,height:22,rx:5,fill:"#dcfce7"},gd);
  el("text",{x:sx(0)-22,y:gy+5,"text-anchor":"middle","font-size":15,"font-weight":800,fill:"#14532d"},gd).textContent = N(Y);
  el("circle",{cx:gx,cy:gy,r:16,fill:"none",stroke:COL[3],"stroke-width":3,class:"pulse"},gTop);
  el("polygon",{points:star(gx,gy,18,7.5),fill:"#f59e0b",stroke:COL[3],"stroke-width":2.5,"stroke-linejoin":"round",class:"fadein"},gTop);
  const sX=N(X), sY=N(Y), s="("+sX+", "+sY+")", cw=10.6, tw=s.length*cw+12, bw=tw+4, bh=46, hit=[];
  [1,2].forEach(k=>ex.xs.forEach(x=>{
    if(!st.plotted[k][x]) return;
    const yy=st.vals[k][x], lw=("("+N(x)+", "+N(yy)+")").length*8, flip=sx(x)+12+lw>W-2;
    hit.push([sx(x)-12,sy(yy)-12,sx(x)+12,sy(yy)+12]);
    const l0=flip?sx(x)-12-lw:sx(x)+12, t0=k===1?sy(yy)-27:sy(yy)+9;
    hit.push([l0,t0,l0+lw,t0+20]);
  }));
  let best=null;
  outer: for(const d of [70,92,114,136]){
    for(const a of [-60,-30,0,-90,30,-120,60,-150,90,180,120,150]){
      const cx=gx+d*Math.cos(a*Math.PI/180), cy=gy+d*Math.sin(a*Math.PI/180);
      const L=cx-bw/2,T=cy-bh/2,R=L+bw,B=T+bh;
      if(L<4||T<4||R>W-4||B>H-4) continue;
      if(hit.some(h=>!(R<h[0]||L>h[2]||B<h[1]||T>h[3]))) continue;
      best={L,T,cx,cy}; break outer;
    }
  }
  if(!best) best={L:Math.max(4,Math.min(W-bw-4,gx-bw/2)),T:Math.max(4,gy-100),cx:gx,cy:Math.max(4,gy-100)+bh/2};
  const lx=best.L+4, ly=best.T+34, lg=el("g",{class:"fadein"},gTop);
  el("line",{x1:gx,y1:gy,x2:best.cx,y2:best.cy,stroke:COL[3],"stroke-width":2},lg);
  el("rect",{x:lx-4,y:ly-34,width:tw,height:bh,rx:8,fill:"#fff",stroke:COL[3],"stroke-width":2},lg);
  el("text",{x:lx+2,y:ly+3,"font-size":20,"font-weight":800,fill:COL[3],"font-family":"ui-monospace,Menlo,Consolas,monospace","xml:space":"preserve"},lg).textContent = s;
  const xc=lx+2+(1+sX.length/2)*cw, yc=lx+2+(1+sX.length+2+sY.length/2)*cw;
  el("text",{x:xc,y:ly-15,"text-anchor":"middle","font-size":12,"font-style":"italic","font-weight":800,fill:"#166534"},lg).textContent="x";
  el("text",{x:yc,y:ly-15,"text-anchor":"middle","font-size":12,"font-style":"italic","font-weight":800,fill:"#166534"},lg).textContent="y";
}

/* ---------- tables ---------- */
function buildTables(){
  [1,2].forEach(k=>{
    const l=ex["l"+k];
    $("tt"+k).textContent = "Line "+k+":  "+l.t;
    let h=`<tr><td class="lab">x</td>`+ex.xs.map(x=>`<th data-k="${k}" data-x="${x}">${N(x)}</th>`).join("")+`</tr>`;
    h+=`<tr><td class="lab">y</td>`+ex.xs.map(x=>`<td data-k="${k}" data-x="${x}"><input class="cell" inputmode="decimal" autocomplete="off" aria-label="y when x = ${x}"></td>`).join("")+`</tr>`;
    h+=`<tr><td class="lab">(x, y)</td>`+ex.xs.map(x=>`<td class="pair l${k}" id="pr${k}_${x}" data-k="${k}" data-x="${x}"></td>`).join("")+`</tr>`;
    $("tbl"+k).innerHTML=h;
  });
  document.querySelectorAll("input.cell").forEach(inp=>{
    const k=Number(inp.parentNode.dataset.k), x=Number(inp.parentNode.dataset.x);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(k,x,inp); focusNext(inp); } });
    inp.addEventListener("change",()=>commit(k,x,inp));
    inp.addEventListener("input",()=>{ inp.classList.remove("no"); inp.classList.remove("want"); });
  });
}
function syncTables(){
  [1,2].forEach(k=>ex.xs.forEach(x=>{
    const pr=$("pr"+k+"_"+x); if(pr) pr.classList.toggle("plotted",!!st.plotted[k][x]);
  }));
}
function focusNext(inp){ const n=[...document.querySelectorAll("input.cell:not([readonly])")].find(i=>i!==inp); if(n) n.focus(); }
function parse(s){ s=String(s).trim().replace(/[−–]/g,"-").replace(",","."); if(s==="") return NaN; const v=Number(s); return isFinite(v)?v:NaN; }

/* ---------- state helpers ---------- */
const allVals = () => [1,2].every(k=>ex.xs.every(x=>st.vals[k][x]!=null));
const allPlotted = () => [1,2].every(k=>ex.xs.every(x=>st.plotted[k][x]));
function curStep(){
  if(!allVals()) return 1;
  if(!allPlotted()) return 2;
  if(!(st.lineDone[1]&&st.lineDone[2])) return 3;
  if(!st.inter) return 4;
  if(!st.answered) return 5;
  return 6;
}
const STEPS = ["① Tables","② Points","③ Lines","④ Crossing","⑤ Solution"];
function updateSteps(){
  const s=curStep();
  $("steps").innerHTML = manual ? STEPS.map((t,i)=>`<span class="${i+1<s?"done":i+1===s?"on":""}">${t}</span>`).join("") : "";
  svg.dataset.step = manual ? s : 0;
}
function stepText(){
  const s=curStep();
  const n=[1,2].reduce((a,k)=>a+ex.xs.filter(x=>st.plotted[k][x]).length,0), tot=ex.xs.length*2;
  return ({
    1:"Step 1 · Fill both tables. Type each y value and press Enter.",
    2:`Step 2 · Plot the points. Go along to x, then up to y — click on the grid. (${n} of ${tot} plotted)`,
    3:"Step 3 · Draw each line with the ruler. Press on a point, drag to another point of the SAME colour, then let go.",
    4:"Step 4 · Where do the two lines cross? Click on the crossing point.",
    5:"Step 5 · Read the crossing point from the axes and write the solution.",
    6:"Well done! This point solves BOTH equations."
  })[s];
}
function setMsg(t,type){ const m=$("msg"); m.textContent=t; m.className="msg"+(type?" "+type:""); if(type==="err"){ void m.offsetWidth; } }
function afterChange(prefix){
  updateSteps();
  if(manual) setMsg((prefix||"")+stepText(),prefix?"ok":"");
}

/* ---------- entering values ---------- */
function commit(k,x,inp){
  if(inp.readOnly || st.vals[k][x]!=null) return;
  const v=parse(inp.value); if(isNaN(v)) return;
  const y=yOf(ex["l"+k],x);
  if(Math.abs(v-y)>1e-9){ inp.classList.add("no"); if(manual) setMsg("Not quite — put x = "+N(x)+" into "+ex["l"+k].t+" and work it out.","err"); return; }
  inp.classList.remove("no","want"); inp.classList.add("ok"); inp.readOnly=true; inp.value=N(y);
  st.vals[k][x]=y;
  const pr=$("pr"+k+"_"+x); pr.textContent="("+N(x)+", "+N(y)+")"; pr.classList.add("show");
  if(!manual){
    st.plotted[k][x]=true;
    const full=ex.xs.every(xx=>st.vals[k][xx]!=null);
    const anim={pts:[{k,x}]};
    if(full && !st.lineDone[k]){ st.lineDone[k]=true; anim.line=k; }
    render(anim);
    if(st.lineDone[1]&&st.lineDone[2]&&!st.inter&&!timer) timer=setTimeout(()=>{ timer=null; st.inter=true; st.answered=true; revealAnswer(); render({}); finish(); },1400);
  } else {
    afterChange(allVals()?"Tables complete ✓ ":"");
  }
}
function nextValue(){
  for(const k of [1,2]) for(const x of ex.xs){
    if(st.vals[k][x]==null){
      const inp=document.querySelector(`td[data-k="${k}"][data-x="${x}"] input`);
      inp.value=yOf(ex["l"+k],x); commit(k,x,inp); return;
    }
  }
}

/* ---------- geometry of the pointer ---------- */
function ptr(e){
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function latticeAt(p){
  let gx=Math.round((p.x-M)/U), gy=Math.round(Y1-(p.y-M)/U);
  gx=Math.max(0,Math.min(X1,gx)); gy=Math.max(0,Math.min(Y1,gy));
  return {x:gx,y:gy,d:Math.hypot(p.x-sx(gx),p.y-sy(gy))};
}
function linesAt(x,y,onlyPlotted){
  return [1,2].filter(k=>st.vals[k][x]!=null && st.vals[k][x]===y && (!onlyPlotted || st.plotted[k][x]));
}
function nearPlotted(p,r){
  let best=null;
  [1,2].forEach(k=>ex.xs.forEach(x=>{
    if(!st.plotted[k][x]) return;
    const y=st.vals[k][x], d=Math.hypot(p.x-sx(x),p.y-sy(y));
    if(d<=r && (!best||d<best.d)) best={x,y,d,ks:linesAt(x,y,true)};
  }));
  return best;
}
function flash(x,y){
  const g=el("g",{class:"xmark"},gFx);
  const cx=sx(x), cy=sy(y);
  el("line",{x1:cx-10,y1:cy-10,x2:cx+10,y2:cy+10,stroke:"#dc2626","stroke-width":5,"stroke-linecap":"round"},g);
  el("line",{x1:cx-10,y1:cy+10,x2:cx+10,y2:cy-10,stroke:"#dc2626","stroke-width":5,"stroke-linecap":"round"},g);
  setTimeout(()=>g.remove(),1000);
}
function pulseAt(x,y,ms){
  const g=el("g",{},gFx);
  el("circle",{cx:sx(x),cy:sy(y),r:20,fill:"rgba(245,158,11,.25)",stroke:"#f59e0b","stroke-width":4,class:"pulse"},g);
  setTimeout(()=>g.remove(),ms||3200);
}

/* ---------- hover crosshair (manual, steps 2 & 4) ---------- */
function clearHover(){ gFx.querySelectorAll(".hov").forEach(n=>n.remove()); }
function hoverAt(p){

  const L=latticeAt(p); if(L.d>0.5*U) return;

  el("rect",{x:sx(0)-34,y:cy-11,width:26,height:22,rx:5,fill:"#e2e8f0"},g);

/* ---------- plotting points (step 2) ---------- */
function plotPoint(x,y){
  const ks=linesAt(x,y,false), fresh=ks.filter(k=>!st.plotted[k][x]);
  fresh.forEach(k=>st.plotted[k][x]=true);
  return {ks,fresh};
}
function plotClick(p){
  const L=latticeAt(p);
  if(L.d>0.42*U){ setMsg("Click exactly on a crossing of two grid lines.","err"); return; }
  const {ks,fresh}=plotPoint(L.x,L.y);
  if(!ks.length){ flash(L.x,L.y); setMsg(`(${L.x}, ${L.y}) is not in either table. Go along to x, then up to y.`,"err"); return; }
  if(!fresh.length){ setMsg("You already plotted that point.","err"); return; }
  clearHover();
  render({pts:fresh.map(k=>({k,x:L.x}))});
  afterChange(ks.length===2?`(${L.x}, ${L.y}) is in BOTH tables — it is on both lines! `:"");
}

/* ---------- ruler (step 3) ---------- */
function drawRuler(a,b){
  gRuler.innerHTML="";
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); if(len<6) return;
  const pv=el("g",{"clip-path":"url(#clipArea)"},gRuler);
  el("line",{x1:a.x-dx*20/len*30,y1:a.y-dy*20/len*30,x2:b.x+dx/len*900,y2:b.y+dy/len*900,stroke:"#94a3b8","stroke-width":2,"stroke-dasharray":"7 6"},pv);
  el("line",{x1:a.x-dx/len*900,y1:a.y-dy/len*900,x2:a.x,y2:a.y,stroke:"#94a3b8","stroke-width":2,"stroke-dasharray":"7 6"},pv);
  let th=Math.atan2(dy,dx)*180/Math.PI; if(dx<0) th+=180;
  const Lr=Math.max(420,len+160), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  const g=el("g",{transform:`translate(${cx},${cy}) rotate(${th})`},gRuler);
  el("rect",{x:-Lr/2,y:0,width:Lr,height:56,rx:5,fill:"rgba(253,224,71,.55)",stroke:"#ca8a04","stroke-width":2},g);
  let d="";
  for(let i=0;i*6<=Lr;i++){ const x=-Lr/2+i*6, t=i%10===0?16:i%5===0?11:7; d+=`M${x} 0v${t}`; }
  el("path",{d,stroke:"#854d0e","stroke-width":1.2},g);
  for(let i=10,c=1;i*6<Lr-30;i+=10,c++) el("text",{x:-Lr/2+i*6,y:32,"text-anchor":"middle","font-size":12,"font-weight":700,fill:"#854d0e"},g).textContent=c;
  el("circle",{cx:a.x,cy:a.y,r:12,fill:"none",stroke:"#f59e0b","stroke-width":3},gRuler);
}
svg.addEventListener("pointerdown",e=>{
  if(!manual||curStep()!==3) return;
  const p=ptr(e), s=nearPlotted(p,22);
  if(!s){ setMsg("Start the ruler on one of the plotted points.","err"); return; }
  if(s.ks.every(k=>st.lineDone[k])){ setMsg("That line is already drawn. Start from a point of the other line.","err"); return; }
  drag={s}; try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  drawRuler({x:sx(s.x),y:sy(s.y)},p);
});
svg.addEventListener("pointermove",e=>{
  const p=ptr(e);
  if(drag){
    const near=nearPlotted(p,22), s=drag.s;
    const b=(near&&!(near.x===s.x&&near.y===s.y))?{x:sx(near.x),y:sy(near.y)}:p;
    drawRuler({x:sx(s.x),y:sy(s.y)},b);
  } else hoverAt(p);
});
svg.addEventListener("pointerleave",()=>{ if(!drag) clearHover(); });
function endDrag(e){
  if(!drag) return;
  const p=ptr(e), E=nearPlotted(p,24), S=drag.s;
  gRuler.innerHTML=""; drag=null;
  if(!E||(E.x===S.x&&E.y===S.y)){ setMsg("Drag the ruler to ANOTHER plotted point, then let go.","err"); return; }
  const ks=S.ks.filter(k=>E.ks.includes(k));
  if(!ks.length){ setMsg("Those two points are from different tables. Pick two points of the same colour.","err"); return; }
  const k=ks.find(k=>!st.lineDone[k]);
  if(!k){ setMsg("Line "+ks[0]+" is already drawn.","err"); return; }
  st.lineDone[k]=true; render({line:k});
  afterChange(`Line ${k} drawn with the ruler ✓ `);
}
svg.addEventListener("pointerup",endDrag);
svg.addEventListener("pointercancel",()=>{ gRuler.innerHTML=""; drag=null; });

/* ---------- crossing (step 4) ---------- */
svg.addEventListener("click",e=>{
  if(!manual) return;
  const s=curStep(), p=ptr(e);
  if(s===1){ setMsg("First fill in the tables of values.","err"); return; }
  if(s===2){ plotClick(p); return; }
  if(s===4){
    const L=latticeAt(p);
    if(L.d>0.42*U){ setMsg("Click exactly on the crossing point.","err"); return; }
    if(L.x===st.sol.x&&L.y===st.sol.y){ foundCrossing(); }
    else { flash(L.x,L.y); setMsg(`(${L.x}, ${L.y}) is not on both lines. Look again — where do they meet?`,"err"); }
  }
});
function foundCrossing(){
  clearHover(); st.inter=true; render({});
  updateSteps(); setMsg("Yes! The lines cross at one point. "+stepText(),"ok");
  showEntry();
}

/* ---------- helper buttons ---------- */
function hint(){
  const s=curStep();
  if(s===1){ const i=[...document.querySelectorAll("input.cell")].find(i=>!i.readOnly); if(i){ i.classList.add("want"); i.focus(); } }
  else if(s===2){ for(const k of [1,2]) for(const x of ex.xs) if(!st.plotted[k][x]){ pulseAt(x,st.vals[k][x]); return; } }
  else if(s===3){ const k=st.lineDone[1]?2:1, xs=ex.xs; pulseAt(xs[0],st.vals[k][xs[0]]); pulseAt(xs[xs.length-1],st.vals[k][xs[xs.length-1]]); }
  else if(s===4){ pulseAt(st.sol.x,st.sol.y,2500); }
  else if(s===5){ const n=$("ax"); if(n) n.focus(); }
}
function auto(){
  const s=curStep();
  if(s===1) nextValue();
  else if(s===2){
    for(const k of [1,2]) for(const x of ex.xs) if(!st.plotted[k][x]){
      const y=st.vals[k][x], {fresh,ks}=plotPoint(x,y);
      render({pts:fresh.map(kk=>({k:kk,x}))}); afterChange(ks.length===2?"Shared point — it is in BOTH tables! ":""); return;
    }
  }
  else if(s===3){ const k=st.lineDone[1]?2:1; st.lineDone[k]=true; render({line:k}); afterChange(`Line ${k} drawn ✓ `); }
  else if(s===4) foundCrossing();
  else if(s===5){ $("ax").value=st.sol.x; $("ay").value=st.sol.y; $("okb").click(); }
}
function buildCtrl(){
  const c=$("ctrl");

    $("hintB").onclick=hint; $("autoB").onclick=auto;
  } else {
    c.innerHTML=`<button class="btn primary dim" id="nextB">Show next value ▶</button>`;
    $("nextB").onclick=nextValue;
  }
}

 {id:"p1",kind:"task",title:"Objective 1 · Pair work",short:"Pair work",badge:"PAIR WORK",bc:"p"},
 {id:"i1",kind:"task",title:"Objective 1 · Assessment",short:"Assessment 1",badge:"INDIVIDUAL",bc:"i"},
 {id:"we2",kind:"we",ex:1,title:"Objective 2 · Worked Example",short:"Worked example 2",badge:"MANUAL",bc:"m"},
 {id:"p2",kind:"task",title:"Objective 2 · Pair work",short:"Pair work",badge:"PAIR WORK",bc:"p"},
 {id:"i2",kind:"task",title:"Objective 2 · Assessment",short:"Assessment 2",badge:"INDIVIDUAL",bc:"i"},
 {id:"self",kind:"self",title:"Check point · Self-assessment",short:"Self-assessment",badge:"THUMBS",bc:"s"},
 {id:"exit",kind:"exit",title:"Plenary · Exit ticket",short:"Exit ticket",badge:"3 · 2 · 1",bc:"e"}
];
let curNode = null;
function showView(v){ ["weView","taskView","selfView","exitView"].forEach(id=>$(id).style.display = id===v ? "" : "none"); }
function stopAll(){ if(timer){ clearTimeout(timer); timer=null; } stopTimer(); }
function openNode(id){
  stopAll();
  const i=SEQ.findIndex(s=>s.id===id), n=SEQ[i]; curNode=i;
  $("map").classList.remove("on"); $("stage").classList.add("on"); fitStage();
  $("stTitle").textContent=n.title;
  if(n.kind!=="we"){ const b=$("badge"); b.textContent=n.badge; b.className="badge "+n.bc; }
  $("reset").style.display = n.kind==="we" ? "" : "none";
  const nx=SEQ[i+1]; $("next").style.display = nx ? "" : "none"; if(nx) $("next").textContent="Next: "+nx.short+" ▶";
  if(n.kind==="we"){ showView("weView"); load(n.ex); }
  else if(n.kind==="task"){ showView("taskView"); renderTask(TASKS[id]); }
  else if(n.kind==="self"){ showView("selfView"); renderSelf(); }
  else { showView("exitView"); renderExit(); }
}
function markDone(){ if(curNode!=null && SEQ[curNode].kind!=="we"){ document.querySelector(`[data-node="${SEQ[curNode].id}"]`).classList.add("fin"); } }
function backToMap(){ stopAll(); markDone(); document.querySelectorAll(".node").forEach(n=>n.classList.add("set")); $("stage").classList.remove("on"); $("map").classList.add("on"); fit(); }
$("back").onclick=backToMap;
$("next").onclick=()=>{ markDone(); openNode(SEQ[curNode+1].id); };
$("reset").onclick=()=>load(cur);
addEventListener("keydown",e=>{ if(e.key==="Escape" && $("stage").classList.contains("on")) backToMap(); });

/* ----- timer ----- */
let tmI=null, tmLeft=0;
function stopTimer(){ if(tmI){ clearInterval(tmI); tmI=null; } }
function showT(){ const d=$("tmDisp"); if(!d) return; d.textContent=String(Math.floor(tmLeft/60)).padStart(2,"0")+":"+String(tmLeft%60).padStart(2,"0"); d.classList.toggle("end",tmLeft<=0); }
function setTimer(m){ stopTimer(); tmLeft=m*60; showT(); const b=$("tmGo"); if(b) b.textContent="▶ Start"; }
function toggleTimer(){
  if(tmI){ stopTimer(); $("tmGo").textContent="▶ Resume"; return; }
  if(tmLeft<=0) return;
  $("tmGo").textContent="⏸ Pause";
  tmI=setInterval(()=>{ tmLeft--; showT(); if(tmLeft<=0){ stopTimer(); $("tmGo").textContent="▶ Start"; } },1000);
}

/* ----- task pages (pair work / assessment) ----- */
function renderTask(t){
  const qi=t.items.filter(it=>it.q||it.cap||it.img).map(it=>{
    const tx=`<div class="qtx"><span class="lb">${it.lb}</span>${it.q?`<span class="q">${it.q}</span>`:""}${it.cap?`<div class="cap2">${it.cap}</div>`:""}</div>`;
    const im=it.img?`<div class="qimg"><img src="${it.img}" alt=""></div>`:"";
    return `<div class="qi${it.row?" row":""}">${it.row?im+tx:tx+im}</div>`;
  }).join("");
  const ans=t.items.map((it,i)=>`<div class="ac" id="ac${i}"><div class="ach"><span class="lb">${it.lb}</span>Answer</div><div class="acb">${it.a}</div><div class="cover">👆 Tap to reveal the answer</div></div>`).join("");
  $("taskView").innerHTML=`
    <div class="card tvtop">
      <div class="tl"><div class="kick">${t.kick}</div><h2>${t.title}</h2><p>${t.sub}</p></div>
      <div class="tmbar"><span id="tmDisp">00:00</span>
        <button class="btn" data-m="3">3</button><button class="btn" data-m="5">5</button><button class="btn" data-m="10">10</button>
        <button class="btn primary" id="tmGo">▶ Start</button>
        <button class="btn" id="allAns" style="margin-left:10px">Show all answers</button></div>
    </div>
    <div class="tvbody">
      <div class="card qpane${t.grid?" grid":""}">
        ${t.key?`<div class="keyidea">${t.key}</div>`:""}
        ${t.img?`<div class="qimg"><img src="${t.img}" alt="Workbook question"></div>`:""}
        ${t.chips?`<div class="chips">${t.chips.map(c=>`<span>${c}</span>`).join("")}</div>`:""}
        ${t.talk?`<div class="talk">${t.talk}</div>`:""}
        ${qi}
      </div>
      <div class="apane">${ans}</div>
    </div>`;
  $("taskView").querySelectorAll(".ac").forEach(a=>a.onclick=()=>a.classList.toggle("open"));
  $("taskView").querySelectorAll(".tmbar [data-m]").forEach(b=>b.onclick=()=>setTimer(Number(b.dataset.m)));
  $("tmGo").onclick=toggleTimer;
  let all=false;
  $("allAns").onclick=()=>{ all=!all; $("taskView").querySelectorAll(".ac").forEach(a=>a.classList.toggle("open",all)); $("allAns").textContent=all?"Hide all answers":"Show all answers"; };
  setTimer(t.timer);
}

/* ----- self-assessment ----- */
const thumbs={1:{up:0,dn:0},2:{up:0,dn:0}};
const OBJT={1:"Draw straight-line graphs from tables of values.",2:"Use the intersection to solve simultaneous equations."};
function renderSelf(){
  $("selfView").innerHTML=`<h2>Self-assessment</h2><p class="lead">Show me with your thumb: do I understand? Tap to count the class.</p>`+[1,2].map(n=>`
    <div class="srow" id="sr${n}">
      <div><h3>Objective ${n}</h3><div class="ot">${OBJT[n]}</div></div>
      <div class="thumbs">
        <div style="text-align:center"><button class="thumb up" data-n="${n}" data-t="up">👍<b id="u${n}">0</b></button><br><button class="minus" data-n="${n}" data-t="up">undo</button></div>
        <div style="text-align:center"><button class="thumb dn" data-n="${n}" data-t="dn">👎<b id="d${n}">0</b></button><br><button class="minus" data-n="${n}" data-t="dn">undo</button></div>
      </div>
      <div class="bar"><i class="g" id="bg${n}" style="width:0"></i><i class="r" id="br${n}" style="width:0"></i></div>
      <div class="tip" id="tip${n}">Waiting for thumbs…</div>
    </div>`).join("");
  $("selfView").querySelectorAll(".thumb").forEach(b=>b.onclick=()=>{ thumbs[b.dataset.n][b.dataset.t]++; upSelf(b.dataset.n); });
  $("selfView").querySelectorAll(".minus").forEach(b=>b.onclick=()=>{ const o=thumbs[b.dataset.n]; if(o[b.dataset.t]>0) o[b.dataset.t]--; upSelf(b.dataset.n); });
  [1,2].forEach(upSelf);
}
function upSelf(n){
  const o=thumbs[n], tot=o.up+o.dn;
  $("u"+n).textContent=o.up; $("d"+n).textContent=o.dn;
  $("bg"+n).style.width=tot?(o.up/tot*100)+"%":"0"; $("br"+n).style.width=tot?(o.dn/tot*100)+"%":"0";
  const tip=$("tip"+n);
  if(!tot){ tip.className="tip"; tip.textContent="Waiting for thumbs…"; }
  else if(o.dn>o.up){ tip.className="tip bad"; tip.innerHTML=`Most thumbs are down — let’s re-teach this one. <button class="btn" id="rt${n}">↩ Back to Worked Example ${n}</button>`; $("rt"+n).onclick=()=>{ openNode("we"+n); }; }
  else if(o.dn>0){ tip.className="tip good"; tip.textContent=`Mostly thumbs up ✓ — quickly help the ${o.dn} thumb${o.dn>1?"s":""} down.`; }
  else { tip.className="tip good"; tip.textContent="All thumbs up — great! ✓"; }
}

let exitStep=0;
function renderExit(){
  exitStep=0;

     <div class="ecard c1" id="ec1"><div class="n">1</div><div class="t">key rule to remember, e.g. “the crossing point solves both equations”</div><div class="ln"></div></div>
   </div>
   <div class="ctrl"><button class="btn primary" id="exNext">Show next ▶</button></div>
   <div class="conf" id="conf"><h3>Confidence today — tap to count the class</h3><div class="crow">
     <button class="cbtn" data-k="a"><span>😀</span>Got it<b id="ca">${conf.a}</b></button>
     <button class="cbtn" data-k="b"><span>🙂</span>Nearly<b id="cb">${conf.b}</b></button>
     <button class="cbtn" data-k="c"><span>😐</span>Need help<b id="cc">${conf.c}</b></button></div></div>`;
  $("exNext").onclick=()=>{
    exitStep++;
    if(exitStep<=3){ $("ec"+(4-exitStep)).classList.add("on"); }
    if(exitStep===3){ $("conf").classList.add("on"); $("exNext").style.display="none"; }
  };
  $("exitView").querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>{ conf[b.dataset.k]++; $("c"+b.dataset.k).textContent=conf[b.dataset.k]; });
}
