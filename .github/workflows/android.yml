name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MathIsland.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest MathIsland.apk --title "Math Island app" --notes "Latest Android app build. Download MathIsland.apk."
        env: { GH_TOKEN: "${{ github.token }}" }
